# Pin list for the `benchmark` conda environment. Create with ../setup.sh, not `conda env create -f`.
# mamba-ssm and flash-attn need the extra flags in that script.
name: benchmark
channels:
  - conda-forge
  - nvidia/label/cuda-12.4.1
dependencies:
  - python=3.12.13
  - pip
  - cuda-nvcc=12.4.131
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0
      - transformers==4.38.0
      - tokenizers==0.15.2
      - numpy==1.26.4
      - rna-fm==0.2.2
      - ml-collections==1.1.0
      - pyyaml==6.0.3
      - pandas==3.0.5
      - scikit-learn==1.9.0
      - matplotlib==3.11.1
      - seaborn==0.13.2
      - tqdm==4.70.0
      - einops==0.8.2
      - scipy==1.17.1
      - opentsne==1.0.4
      - pytest==9.1.1
      - ninja==1.13.0
      - packaging==26.3
      - hydra-core==1.3.5
      - omegaconf==2.3.1
      - bitarray==3.10.1
      - sacrebleu==2.6.0
      - regex==2026.7.19
      - mamba-ssm==2.2.2
      - flash-attn==2.7.4.post1
